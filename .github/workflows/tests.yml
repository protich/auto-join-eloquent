name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: composer test
      - run: composer phpstan -- --memory-limit=1G
      - run: composer phpstan:model-api
